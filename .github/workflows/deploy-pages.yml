name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'llm-wiki/**'
      - 'sa-token-doc/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            llm-wiki
            sa-token-doc

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp -r llm-wiki/. _site/
          cp -r sa-token-doc _site/sa-token-doc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
