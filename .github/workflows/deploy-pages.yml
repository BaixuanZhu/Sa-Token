name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'llm-wiki/**'
      - 'sa-token-doc/**'
      - 'skills/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ["Sync Upstream Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          sparse-checkout: |
            llm-wiki
            sa-token-doc
            skills

      - name: Generate llms.txt and clean docs
        run: node llm-wiki/scripts/generate-llms.js

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp -r llm-wiki/. _site/
          cp -r docs _site/docs
          cp -r skills _site/skills

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
