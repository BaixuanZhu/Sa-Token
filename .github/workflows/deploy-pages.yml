name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'index.html'
      - 'llms-viewer.html'
      - '.nojekyll'
      - 'sa-token-doc/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            llms-viewer.html
            .nojekyll
            sa-token-doc
            llms.txt
            llms-full.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
