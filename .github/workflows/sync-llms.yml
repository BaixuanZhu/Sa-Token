name: Sync & Deploy

on:
  schedule:
    # 每周一 00:00 UTC 自动执行
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # 手动触发
  push:
    branches: [main]
    paths:
      - 'llm-wiki/index.html'
      - 'llm-wiki/llms-viewer.html'
      - 'llm-wiki/.nojekyll'
      - 'sa-token-doc/**'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── Sync & Generate（仅定时/手动触发）──
      - name: Configure upstream remote
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: git remote add upstream https://github.com/dromara/Sa-Token.git || true

      - name: Sync docs from upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: sync
        run: |
          git fetch upstream master
          # 只同步 sa-token-doc 目录，避免 merge 冲突
          git checkout upstream/master -- sa-token-doc/
          if git diff --cached --quiet -- sa-token-doc/; then
            echo "docs_changed=false" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate llms.txt
        if: steps.sync.outputs.docs_changed == 'true'
        run: node llm-wiki/scripts/generate-llms.js

      - name: Commit & Push
        if: steps.sync.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sa-token-doc/ llm-wiki/llms.txt llm-wiki/llms-full.txt
          git commit -m "auto: sync docs & regenerate llms.txt"
          git push

      # ── Deploy to GitHub Pages ──
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'llm-wiki'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
