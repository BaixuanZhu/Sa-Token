name: Sync Upstream

on:
  schedule:
    # 每周一 00:00 UTC 自动执行（北京时间周一 08:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── Sync & Generate（仅定时/手动触发）──
      - name: Configure upstream remote
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: git remote add upstream https://github.com/dromara/Sa-Token.git || true

      - name: Sync docs from upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: sync
        run: |
          git fetch upstream master
          # 只同步 sa-token-doc 目录，避免 merge 冲突
          git checkout upstream/master -- sa-token-doc/
          if git diff --cached --quiet -- sa-token-doc/; then
            echo "docs_changed=false" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          fi

      # 生成 llms.txt / llms-full.txt / docs/（供提交入库；docs/ 在部署时再由 deploy-pages.yml 现生成）
      - name: Generate llms.txt and clean docs
        run: node llm-wiki/scripts/generate-llms.js

      - name: Commit & Push
        if: steps.sync.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sa-token-doc/ llm-wiki/llms.txt llm-wiki/llms-full.txt
          git commit -m "auto: sync docs & regenerate llms.txt" || echo "nothing to commit"
          git push
          # push 到 dev 会触发 deploy-pages.yml 完成部署，本工作流不再负责部署
