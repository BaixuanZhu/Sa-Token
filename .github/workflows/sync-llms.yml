name: Sync Upstream Release

on:
  schedule:
    # 每日 02:00 UTC（北京时间 10:00）轮询上游发版
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/dromara/Sa-Token.git || true

      # ── 1. 发版追踪：对比 GitHub Releases latest 与本地 marker ──
      - name: Detect latest release
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/dromara/Sa-Token/releases/latest"
          DATA=$(curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" "$API")
          TAG=$(echo "$DATA" | jq -r .tag_name)
          NAME=$(echo "$DATA" | jq -r .name)
          BODY=$(echo "$DATA" | jq -r .body)
          PRERELEASE=$(echo "$DATA" | jq -r .prerelease)
          MARKER_FILE=".github/last_synced_release"
          MARKER=$(cat "$MARKER_FILE" 2>/dev/null || echo "")
          echo "latest tag: $TAG | marker: $MARKER | prerelease: $PRERELEASE"
          if [ "$PRERELEASE" = "true" ]; then
            echo "skip: prerelease, do nothing"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TAG" = "$MARKER" ]; then
            echo "skip: already synced $TAG"
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new release detected: $TAG"
          {
            echo "notify=true"
            echo "version=$TAG"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "Sa-Token $TAG 已发布，文档已自动同步至本仓库（llm-wiki）。"
            echo ""
            echo "发版名称：$NAME"
            echo ""
            echo "发版说明："
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 2. 同步文档：从发版对应的 tag 拉取 sa-token-doc/ ──
      - name: Sync docs from release tag
        if: steps.detect.outputs.notify == 'true'
        run: |
          TAG="${{ steps.detect.outputs.version }}"
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG" -- sa-token-doc/

      # ── 3. 重新生成 llms.txt / llms-full.txt ──
      - name: Generate llms.txt and clean docs
        if: steps.detect.outputs.notify == 'true'
        run: node llm-wiki/scripts/generate-llms.js

      # ── 3.5 渲染发版说明为 HTML 并注入 changelog.html 更新日志页面 ──
      - name: Render changelog and inject
        if: steps.detect.outputs.notify == 'true'
        env:
          BODY: ${{ steps.detect.outputs.body }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          printf '%s' "$BODY" > /tmp/changelog.md
          npx -y marked -i /tmp/changelog.md -o /tmp/changelog.html
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['VERSION']
          html = pathlib.Path('/tmp/changelog.html').read_text(encoding='utf-8')
          fragment = '<div class="changelog-body">\n<h3>Sa-Token ' + version + ' 更新日志</h3>\n' + html + '\n</div>'
          p = pathlib.Path('llm-wiki/changelog.html')
          s = p.read_text(encoding='utf-8')
          new_s, n = re.subn(r'<!-- CHANGELOG_START -->.*?<!-- CHANGELOG_END -->',
                             '<!-- CHANGELOG_START -->\n' + fragment + '\n      <!-- CHANGELOG_END -->', s, flags=re.S)
          assert n == 1, f"changelog placeholder not found exactly once: {n}"
          p.write_text(new_s, encoding='utf-8')
          print("changelog injected, replaced", n)
          PY

      # ── 4. 入库（push 到 dev 触发 deploy-pages.yml 部署）并更新 marker ──
      - name: Commit & Push
        if: steps.detect.outputs.notify == 'true'
        run: |
          TAG="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$TAG" > .github/last_synced_release
          git add sa-token-doc/ llm-wiki/llms.txt llm-wiki/llms-full.txt llm-wiki/changelog.html .github/last_synced_release
          git commit -m "auto: sync Sa-Token $TAG docs & regenerate llms.txt" || echo "nothing to commit"
          git push

      # ── 5. 发邮件通知（SMTP 未配置时不影响同步，仅跳过发信）──
      - name: Send notification email
        if: steps.detect.outputs.notify == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Sa-Token 文档站] ${{ steps.detect.outputs.version }} 已发版并同步"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: ${{ steps.detect.outputs.notes }}
          convert_markdown: true
