name: Sync Upstream & Generate llms.txt

on:
  schedule:
    # 每周一 00:00 UTC 自动执行
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # 手动触发

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            sa-token-doc
            scripts

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/dromara/Sa-Token.git || true

      - name: Sync docs from upstream
        id: sync
        run: |
          git fetch upstream master
          # 只同步 sa-token-doc 目录，避免 merge 冲突
          git checkout upstream/master -- sa-token-doc/
          if git diff --cached --quiet -- sa-token-doc/; then
            echo "docs_changed=false" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate llms.txt
        if: steps.sync.outputs.docs_changed == 'true'
        run: node scripts/generate-llms.js

      - name: Commit & Push
        if: steps.sync.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sa-token-doc/ llms.txt llms-full.txt
          git commit -m "auto: sync docs & regenerate llms.txt"
          git push
