    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      color: #2c3e50;
      min-height: 100vh;

    .container {

    .logo {

      gap: 16px;
      align-items: center;

      border-radius: 10px;

      font-size: 16px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);

      background: #42b983;

      background: transparent;
      color: #999;
      font-size: 14px;
      font-weight: 400;
      width: auto;
      padding: 8px 16px;
    }
    .link-raw:hover { color: #42b983; background: transparent; box-shadow: none; transform: none; }
    .link-github {
      background: transparent;
      color: #999;
      font-size: 14px;
      font-weight: 400;
      width: auto;
      padding: 8px 16px;
    }
    .link-github:hover { color: #42b983; background: transparent; box-shadow: none; transform: none; }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #bbb;
