<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sa-Token 文档索引查看器 — 登录认证 · 权限 · SSO · OAuth2 | llms.txt</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="description" content="Sa-Token 全部文档的可视化索引，支持按分组浏览和全文搜索。覆盖登录认证、权限认证、SSO、OAuth2、微服务鉴权等 100+ 文档条目。">
  <meta name="keywords" content="Sa-Token, Java权限认证, 登录认证, 权限校验, 单点登录, SSO, OAuth2, Session会话, 微服务鉴权, API Key认证, StpUtil, token管理, 踢人下线, SpringBoot认证框架, sa-token文档, sa-token教程">
  <meta property="og:title" content="Sa-Token 文档索引查看器">
  <meta property="og:description" content="Sa-Token 全部文档的可视化索引，覆盖登录认证、权限、SSO、OAuth2 等 100+ 条目">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://baixuanzhu.github.io/Sa-Token/llms-viewer.html">
  <meta property="og:image" content="https://baixuanzhu.github.io/Sa-Token/logo.png">
  <meta property="og:locale" content="zh_CN">
  <link rel="canonical" href="https://baixuanzhu.github.io/Sa-Token/llms-viewer.html">
  <style>
    :root {
      --primary: #42b983;
      --primary-light: #e8f7f0;
      --bg: #f8f9fa;
      --card-bg: #fff;
      --border: #eaecef;
      --text: #2c3e50;
      --text-light: #666;
      --text-muted: #999;
      --code-bg: #f6f8fa;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    .header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 24px 24px 20px;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .header-logo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .header-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      padding: 2px 0;
      margin-bottom: 10px;
    }
    .header-back:hover { text-decoration: underline; }
    .header .desc {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 12px;
      max-width: 800px;
    }
    .header .desc p { margin-bottom: 4px; }
    .stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tabs .spacer { flex: 1; }

    /* ── Index View: sidebar + content ── */
    .index-view {
      display: flex;
      min-height: calc(100vh - 260px);
    }
    .index-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 12px 0;
      overflow-y: auto;
    }
    .index-content {
      flex: 1;
      padding: 24px 32px;
      min-width: 0;
    }
    .sidebar-group-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 8px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      text-align: left;
      transition: background 0.15s;
      gap: 8px;
    }
    .sidebar-group-btn:hover { background: var(--bg); }
    .sidebar-group-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }
    .sidebar-group-btn .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sidebar-group-btn.active .dot { opacity: 1; }
    .sidebar-group-btn .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 16px;
    }
    .sidebar-optional-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 20px 2px;
      margin-top: 4px;
    }
    .content-section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .content-section-title .optional-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 400;
      color: #e6a23c;
      background: #fdf6ec;
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .doc-link {
      display: flex;
      align-items: center;
      padding: 7px 0;
      font-size: 14px;
      color: var(--text);
      transition: color 0.15s;
      border-bottom: 1px solid var(--bg);
    }
    .doc-link:last-child { border-bottom: none; }
    .doc-link:hover {
      color: var(--primary);
      text-decoration: none;
    }
    .doc-link .path {
      color: var(--text-muted);
      font-size: 12px;
      font-family: 'SF Mono', Consolas, monospace;
      margin-left: auto;
      padding-left: 12px;
    }
    .index-view .loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .index-view { flex-direction: column; }
      .index-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* ── Full Text View ── */
    .full-view {
      padding: 16px 24px;
    }
    .search-box {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .search-box:focus { border-color: var(--primary); }
    .full-text-container {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .full-text {
      padding: 16px 20px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 75vh;
      overflow-y: auto;
      color: var(--text);
    }
    .full-text .line-h1 { color: #1a1a1a; font-weight: 700; font-size: 15px; }
    .full-text .line-h2 { color: var(--primary); font-weight: 600; margin-top: 8px; }
    .full-text .line-h3 { color: #555; font-weight: 600; }
    .full-text .line-bq { color: var(--text-muted); font-style: italic; }
    .full-text .line-link a { color: #4078c0; }
    .full-text mark { background: #fff3a0; padding: 0 2px; border-radius: 2px; }
    .full-text .line-hidden { display: none; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <a class="header-back" href="./">← 返回 LLM Wiki 首页</a>
  <div class="header-top">
    <img class="header-logo" src="logo.png" alt="Sa-Token" onerror="this.style.display='none'">
    <h1>Sa-Token llms.txt 查看器</h1>
  </div>
  <div class="desc" id="desc"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="index">📋 索引视图</button>
  <button class="tab-btn" data-tab="full">📄 全文视图</button>
  <div class="spacer"></div>
</div>

<!-- Index View -->
<div id="index-view" class="index-view">
  <div class="loading" id="index-loading"><div class="spinner"></div><br>加载 llms.txt...</div>
</div>

<!-- Full Text View -->
<div id="full-view" class="full-view" style="display:none">
  <input class="search-box" id="search-box" type="search" placeholder="搜索全文内容..." />
  <div class="full-text-container">
    <pre class="full-text" id="full-text"><div class="loading"><div class="spinner"></div><br>加载 llms-full.txt...</div></pre>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ─── State ───
  let llmsTxtContent = null;
  let llmsFullContent = null;
  let parsedData = null;

  // ─── Parse llms.txt ───
  function parseLlmsTxt(text) {
    const lines = text.split('\n');
    const result = {
      title: '',
      descriptions: [],
      groups: [],
      optionalGroups: []
    };

    let currentGroup = null;
    let inOptional = false;
    let inDescription = false;

    for (const line of lines) {
      // H1 — title
      if (/^# /.test(line)) {
        result.title = line.replace(/^# /, '').trim();
        continue;
      }

      // Blockquote — description
      if (/^> /.test(line)) {
        result.descriptions.push(line.replace(/^> /, '').trim());
        inDescription = true;
        continue;
      }
      if (inDescription && line.trim() === '') {
        inDescription = false;
        continue;
      }
      if (inDescription && !/^#/.test(line) && !/^-/.test(line)) {
        continue;
      }

      // H2 — group
      if (/^## /.test(line)) {
        const groupName = line.replace(/^## /, '').trim();
        inOptional = (groupName === 'Optional');
        currentGroup = { name: groupName, items: [] };
        if (inOptional) {
          result.optionalGroups.push(currentGroup);
        } else {
          result.groups.push(currentGroup);
        }
        continue;
      }

      // List item with link
      if (/^\s*- \[/.test(line) && currentGroup) {
        const match = line.match(/\[([^\]]+)\]\(([^)]+)\)/);
        if (match) {
          // Convert sa-token-doc/use/login-auth.md → use/login-auth
          let path = match[2];
          path = path.replace(/^sa-token-doc\//, '').replace(/\.md$/, '');
          currentGroup.items.push({
            title: match[1],
            path: path,
            rawPath: match[2]
          });
        }
        continue;
      }
    }

    return result;
  }

  // ─── Render Index View ───
  function renderIndex(data) {
    // Description
    const descEl = document.getElementById('desc');
    if (data.descriptions.length > 0) {
      descEl.innerHTML = data.descriptions
        .map(d => '<p>' + escapeHtml(d) + '</p>')
        .join('');
    }

    // Stats
    const totalDocs = data.groups.reduce((s, g) => s + g.items.length, 0)
      + data.optionalGroups.reduce((s, g) => s + g.items.length, 0);
    const totalGroups = data.groups.length + data.optionalGroups.length;
    const statsEl = document.getElementById('stats');
    statsEl.innerHTML =
      '<span class="stat">' + totalGroups + ' 个分组</span>' +
      '<span class="stat">' + totalDocs + ' 篇文档</span>' +
      '<span class="stat" id="full-size-stat">全文加载中...</span>';

    // Build sidebar + content layout
    const container = document.getElementById('index-view');
    const allGroups = data.groups.concat(data.optionalGroups);

    // Sidebar HTML
    let sidebarHtml = '';
    data.groups.forEach((group, i) => {
      sidebarHtml +=
        '<button class="sidebar-group-btn" data-idx="' + i + '">' +
        '<span class="dot"></span>' +
        escapeHtml(group.name) +
        '<span class="count">' + group.items.length + '</span>' +
        '</button>';
    });

    if (data.optionalGroups.length > 0) {
      sidebarHtml += '<div class="sidebar-divider"></div>';
      sidebarHtml += '<div class="sidebar-optional-label">Optional</div>';
      data.optionalGroups.forEach((group, i) => {
        const idx = data.groups.length + i;
        sidebarHtml +=
          '<button class="sidebar-group-btn" data-idx="' + idx + '">' +
          '<span class="dot"></span>' +
          escapeHtml(group.name) +
          '<span class="count">' + group.items.length + '</span>' +
          '</button>';
      });
    }

    // Content placeholder
    container.innerHTML =
      '<nav class="index-sidebar">' + sidebarHtml + '</nav>' +
      '<main class="index-content" id="index-content"></main>';

    // Click handler
    container.querySelectorAll('.sidebar-group-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.getAttribute('data-idx'));
        selectGroup(idx, allGroups);
      });
    });

    // Select first group by default
    if (allGroups.length > 0) {
      selectGroup(0, allGroups);
    }
  }

  function selectGroup(idx, allGroups) {
    // Update sidebar active
    const container = document.getElementById('index-view');
    container.querySelectorAll('.sidebar-group-btn').forEach(b => b.classList.remove('active'));
    const btn = container.querySelector('.sidebar-group-btn[data-idx="' + idx + '"]');
    if (btn) btn.classList.add('active');

    // Render content
    const content = document.getElementById('index-content');
    const group = allGroups[idx];
    const isOptional = idx >= (allGroups.length - parsedData.optionalGroups.length);

    let linksHtml = '';
    for (const item of group.items) {
      linksHtml +=
        '<a class="doc-link" href="https://sa-token.cc/doc.html#/' + item.path + '" target="_blank" rel="noopener">' +
        '<span>' + escapeHtml(item.title) + '</span>' +
        '<span class="path">' + escapeHtml(item.path) + '</span>' +
        '</a>';
    }

    content.innerHTML =
      '<div class="content-section-title">' +
      escapeHtml(group.name) +
      (isOptional ? '<span class="optional-tag">Optional</span>' : '') +
      ' <span style="font-weight:400;color:var(--text-muted);font-size:13px">· ' + group.items.length + ' 篇文档</span>' +
      '</div>' +
      linksHtml;
  }

  // ─── Render Full Text View ───
  function renderFullText(text) {
    const pre = document.getElementById('full-text');
    const lines = text.split('\n');
    let html = '';

    for (const line of lines) {
      let cls = '';
      let content = line;

      if (/^# /.test(line)) {
        cls = 'line-h1';
      } else if (/^## /.test(line)) {
        cls = 'line-h2';
      } else if (/^### /.test(line)) {
        cls = 'line-h3';
      } else if (/^> /.test(line)) {
        cls = 'line-bq';
      } else if (/^\s*- \[/.test(line)) {
        cls = 'line-link';
        content = line.replace(
          /\[([^\]]+)\]\(([^)]+)\)/g,
          '<a href="$2">$1</a>'
        );
      }

      html += '<div class="' + cls + '" data-text="' + escapeAttr(line.toLowerCase()) + '">'
        + escapeHtml(content) + '</div>';
    }

    // Handle empty lines
    html = html.replace(/<div class="" data-text="">\s*<\/div>/g, '<div class="" data-text="">&nbsp;</div>');

    pre.innerHTML = html;

    // Update size stat
    const sizeKB = (new Blob([text]).size / 1024).toFixed(1);
    const sizeStat = document.getElementById('full-size-stat');
    if (sizeStat) sizeStat.textContent = '全文 ' + sizeKB + ' KB';
  }

  // ─── Search Filter ───
  function filterFullText(query) {
    const pre = document.getElementById('full-text');
    const lines = pre.querySelectorAll('div[data-text]');
    const q = query.trim().toLowerCase();

    if (!q) {
      lines.forEach(l => l.classList.remove('line-hidden'));
      return;
    }

    lines.forEach(line => {
      const text = line.getAttribute('data-text') || '';
      if (text.includes(q)) {
        line.classList.remove('line-hidden');
      } else {
        line.classList.add('line-hidden');
      }
    });
  }

  // ─── Tab Switching ───
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      const tab = this.getAttribute('data-tab');
      document.getElementById('index-view').style.display = (tab === 'index') ? '' : 'none';
      document.getElementById('full-view').style.display = (tab === 'full') ? '' : 'none';

      // Lazy load full text
      if (tab === 'full' && !llmsFullContent) {
        loadFullText();
      }
    });
  });

  // ─── Search Box ───
  let searchTimer = null;
  document.getElementById('search-box').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    const query = e.target.value;
    searchTimer = setTimeout(function() {
      filterFullText(query);
    }, 200);
  });

  // ─── Load Functions ───
  function loadLlmsTxt() {
    fetch('llms.txt')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(text => {
        llmsTxtContent = text;
        parsedData = parseLlmsTxt(text);
        renderIndex(parsedData);
      })
      .catch(err => {
        document.getElementById('index-loading').innerHTML =
          '<div style="color:#999;padding:40px;text-align:center">' +
          '⚠ 加载 llms.txt 失败: ' + escapeHtml(err.message) + '<br><br>' +
          '请确保通过 HTTP 服务访问（而非直接打开文件）' +
          '</div>';
      });
  }

  function loadFullText() {
    fetch('llms-full.txt')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(text => {
        llmsFullContent = text;
        renderFullText(text);
      })
      .catch(err => {
        document.getElementById('full-text').innerHTML =
          '<div style="color:#999;padding:40px;text-align:center">' +
          '⚠ 加载 llms-full.txt 失败: ' + escapeHtml(err.message) +
          '</div>';
      });
  }

  // ─── Utils ───
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function escapeAttr(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ─── Init ───
  loadLlmsTxt();
})();
</script>

</body>
</html>
